{% extends "base.html" %}
{% block title %}Log in · Attendance Dashboard{% endblock %}
{% block content %}<div class="login-card panel"><h1>Administrator login</h1><p>Sign in to access attendance records and controls.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Log in</button></form></div>{% endblock %}
